name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "SocialFlow/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "SocialFlow/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SocialFlow APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SocialFlow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            echo "Android SDK license acceptance failed with exit code $sdk_status"
            exit "$sdk_status"
          fi

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify build tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialFlow-Android-APK
          path: SocialFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
